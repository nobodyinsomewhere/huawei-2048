<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048 · 专属小游戏</title>
<style>
  :root{
    --bg:#faf8ef; --text:#776e65; --light:#f9f6f2;
    --cell:rgba(238,228,218,.35); --board:#bbada0;
    --c2:#eee4da; --c4:#ede0c8; --c8:#f2b179; --c16:#f59563;
    --c32:#f67c5f; --c64:#f65e3b; --c128:#edcf72; --c256:#edcc61;
    --c512:#edc850; --c1024:#edc53f; --c2048:#edc22e;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Helvetica,Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;padding:16px;
    touch-action:manipulation;overflow:hidden;
  }
  .wrap{width:min(92vw,480px)}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  h1{margin:0;font-size:clamp(28px,7vw,40px);letter-spacing:1px}
  .scores{display:flex;gap:8px}
  .score{background:var(--board);color:#fff;border-radius:8px;padding:8px 14px;min-width:78px;text-align:center}
  .score span{display:block;font-size:11px;letter-spacing:1px;opacity:.75}
  .score strong{font-size:20px;line-height:1.2}
  .bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 12px;font-size:13px;line-height:1.5}
  .btn{
    border:0;border-radius:8px;background:#8f7a66;color:#f9f6f2;
    padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;
  }
  .btn:active{transform:translateY(1px)}
  .board{
    position:relative;background:var(--board);border-radius:10px;padding:10px;
    aspect-ratio:1/1;user-select:none;
  }
  .grid,.tiles{position:absolute;inset:10px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:10px}
  .grid div{background:var(--cell);border-radius:6px}
  .tiles{pointer-events:none}
  .tile{
    display:flex;align-items:center;justify-content:center;
    border-radius:6px;font-weight:800;color:#776e65;
    font-size:clamp(18px,6vw,34px);transition:transform .08s ease;
    will-change:transform;
  }
  .tile.new{animation:pop .14s ease}
  .tile.merged{animation:bump .14s ease}
  @keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}
  @keyframes bump{0%{transform:scale(1)}50%{transform:scale(1.14)}100%{transform:scale(1)}}
  .t2{background:var(--c2)} .t4{background:var(--c4)}
  .t8{background:var(--c8);color:#f9f6f2} .t16{background:var(--c16);color:#f9f6f2}
  .t32{background:var(--c32);color:#f9f6f2} .t64{background:var(--c64);color:#f9f6f2}
  .t128{background:var(--c128);color:#f9f6f2;font-size:clamp(16px,5.2vw,30px)}
  .t256{background:var(--c256);color:#f9f6f2;font-size:clamp(16px,5.2vw,30px)}
  .t512{background:var(--c512);color:#f9f6f2;font-size:clamp(16px,5.2vw,30px)}
  .t1024{background:var(--c1024);color:#f9f6f2;font-size:clamp(14px,4.4vw,26px)}
  .t2048{background:var(--c2048);color:#f9f6f2;font-size:clamp(14px,4.4vw,26px)}
  .over{
    position:absolute;inset:0;border-radius:10px;background:rgba(250,248,239,.78);
    display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;
    font-size:28px;font-weight:800;
  }
  .over.show{display:flex}
  .hint{text-align:center;font-size:12px;opacity:.65;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>2048</h1>
    <div class="scores">
      <div class="score"><span>SCORE</span><strong id="score">0</strong></div>
      <div class="score"><span>BEST</span><strong id="best">0</strong></div>
    </div>
  </header>
  <div class="bar">
    <div>合并数字，冲上 <b>2048</b>！</div>
    <button class="btn" id="restart">新游戏</button>
  </div>
  <div class="board" id="board">
    <div class="grid">
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
      <div></div><div></div><div></div><div></div>
    </div>
    <div class="tiles" id="tiles"></div>
    <div class="over" id="over">
      <div id="overText">游戏结束</div>
      <button class="btn" id="again">再来一局</button>
    </div>
  </div>
  <div class="hint">电脑：方向键 / WASD　手机：滑动屏幕</div>
</div>
<script>
(function(){
  const SIZE=4;
  const tilesEl=document.getElementById('tiles');
  const scoreEl=document.getElementById('score');
  const bestEl=document.getElementById('best');
  const overEl=document.getElementById('over');
  const overText=document.getElementById('overText');
  let grid,score,best,over,idSeq;

  best=Number(localStorage.getItem('best2048')||0);
  bestEl.textContent=best;

  function reset(){
    grid=Array.from({length:SIZE},()=>Array(SIZE).fill(0));
    score=0;over=false;idSeq=1;
    scoreEl.textContent='0';
    overEl.classList.remove('show');
    addTile();addTile();render();
  }

  function empties(){
    const out=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++)if(!grid[r][c])out.push([r,c]);
    return out;
  }

  function addTile(){
    const e=empties();
    if(!e.length)return null;
    const [r,c]=e[Math.floor(Math.random()*e.length)];
    const v=Math.random()<0.9?2:4;
    grid[r][c]={v,id:idSeq++,isNew:true};
    return [r,c];
  }

  function render(){
    const cells=[];
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      const t=grid[r][c];
      if(!t)continue;
      const d=document.createElement('div');
      d.className='tile t'+t.v+(t.isNew?' new':'')+(t.merged?' merged':'');
      d.textContent=t.v;
      d.style.gridRow=String(r+1);
      d.style.gridColumn=String(c+1);
      cells.push(d);
    }
    tilesEl.replaceChildren(...cells);
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      if(grid[r][c]){grid[r][c].isNew=false;grid[r][c].merged=false;}
    }
  }

  function slideLine(line){
    const vals=line.filter(Boolean);
    const out=[];
    let gained=0;
    for(let i=0;i<vals.length;i++){
      if(i+1<vals.length&&vals[i].v===vals[i+1].v){
        const nv=vals[i].v*2;
        out.push({v:nv,id:vals[i].id,merged:true});
        gained+=nv;
        i++;
      }else{
        out.push({v:vals[i].v,id:vals[i].id});
      }
    }
    while(out.length<SIZE)out.push(0);
    return {out,gained};
  }

  function move(dir){
    if(over)return false;
    let moved=false,gained=0;
    const lines=[];
    for(let i=0;i<SIZE;i++){
      if(dir==='left')lines.push(Array.from({length:SIZE},(_,j)=>grid[i][j]));
      else if(dir==='right')lines.push(Array.from({length:SIZE},(_,j)=>grid[i][SIZE-1-j]));
      else if(dir==='up')lines.push(Array.from({length:SIZE},(_,j)=>grid[j][i]));
      else lines.push(Array.from({length:SIZE},(_,j)=>grid[SIZE-1-j][i]));
    }
    const results=lines.map(slideLine);
    for(let i=0;i<SIZE;i++){
      const {out,g}=results[i];gained+=g;
      for(let j=0;j<SIZE;j++){
        const v=out[j]?out[j].v:0;
        const idx=(dir==='right')?SIZE-1-j:(dir==='down')?SIZE-1-j:j;
        const r=(dir==='left'||dir==='right')?i:idx;
        const c=(dir==='left'||dir==='right')?idx:i;
        const before=grid[r][c]?grid[r][c].v:0;
        if(before!==v)moved=true;
        grid[r][c]=out[j]?{...out[j]}:0;
      }
    }
    if(!moved)return false;
    score+=gained;
    scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best;localStorage.setItem('best2048',String(best));}
    addTile();
    render();
    if(!canMove()){
      over=true;
      overText.textContent='游戏结束 · 得分 '+score;
      overEl.classList.add('show');
    }
    return true;
  }

  function canMove(){
    if(empties().length)return true;
    for(let r=0;r<SIZE;r++)for(let c=0;c<SIZE;c++){
      const v=grid[r][c].v;
      if(c+1<SIZE&&grid[r][c+1].v===v)return true;
      if(r+1<SIZE&&grid[r+1][c].v===v)return true;
    }
    return false;
  }

  document.addEventListener('keydown',e=>{
    const k=e.key.toLowerCase();
    const map={arrowleft:'left',arrowright:'right',arrowup:'up',arrowdown:'down',a:'left',d:'right',w:'up',s:'down'};
    if(map[k]){e.preventDefault();move(map[k]);}
  });

  let sx=0,sy=0,tracking=false;
  const board=document.getElementById('board');
  board.addEventListener('touchstart',e=>{
    if(e.touches.length!==1)return;
    tracking=true;sx=e.touches[0].clientX;sy=e.touches[0].clientY;
  },{passive:true});
  board.addEventListener('touchmove',e=>{if(tracking)e.preventDefault();},{passive:false});
  board.addEventListener('touchend',e=>{
    if(!tracking)return;
    tracking=false;
    const t=e.changedTouches[0];
    const dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?'right':'left');
    else move(dy>0?'down':'up');
  });

  document.getElementById('restart').addEventListener('click',reset);
  document.getElementById('again').addEventListener('click',reset);
  reset();
})();
</script>
</body>
</html>
